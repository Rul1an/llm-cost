stages:
  - preflight

llm_budget:
  stage: preflight
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
    # Installer handles platform detection and checksum verification
    - curl -sSfL https://get.llm-cost.dev | sh
  script:
    - echo "Checking prompt costs..."
    # Pipe JSONL dataset to estimate costs
    # Fails if processing cost > $5.00
    - cat my_dataset.jsonl | llm-cost pipe --model openai/gpt-4o --summary --max-cost 5.00
