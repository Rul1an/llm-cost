name: LLM Budget Check

on:
  pull_request:
    paths:
      - 'prompts/**'

jobs:
  cost-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Budget Check
        uses: Rul1an/llm-cost@v1
        with:
          budget: "10.00"
          fail-on-increase: "true"
          manifest: "llm-cost.toml"
