<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>llm-cost - Static Cost Analysis</title>
    <meta name="description"
        content="Predict LLM costs before you run. Locally verified, offline-first cost analysis for CI/CD.">
    <!-- Use shared styles for typography and components -->
    <link rel="stylesheet" href="/pricing/styles.css">
    <style>
        /* INVERTED / DARK MODE OVERRIDES */
        :root {
            --bg: #0a0a0a;
            --text: #ffffff;
            --text-muted: #a3a3a3;
            --border: #333;
            --border-light: #262626;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            /* Override button colors for dark mode */
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            text-align: center;
            /* Centralized layout */
        }

        /* Adjustments for dark mode buttons */
        .btn.primary {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn.primary:hover {
            background: #e5e5e5;
            color: #000;
        }

        .btn.secondary {
            color: #fff;
            border-color: #333;
        }

        .btn.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #666;
        }

        /* Centralized Hero adjustments */
        .hero-content h1 {
            font-size: 4rem;
            /* Larger impact */
            margin-bottom: 1.5rem;
            letter-spacing: -0.04em;
        }

        .code-block {
            background: #111;
            border-color: #333;
            margin: 2rem auto;
            /* Center it */
            max-width: 600px;
            text-align: left;
            position: relative;
            z-index: 10;
        }

        /* The Glow Effect */
        .glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
            opacity: 0.15;
        }

        /* Overrides to hide Nav/Footer to focus on landing experience,
           or keep them minimal?
           User liked "centralized llm-cost".
           I will put a minimal refined brand header.
        */
        nav {
            justify-content: center;
            /* Center the links? Or separate? */
            margin-bottom: 2rem;
        }

        .container {
            position: relative;
            /* For glow z-index context */
        }
    </style>
</head>

<body>
    <div class="glow"></div>

    <main class="container">
        <!-- Minimal Brand Header -->
        <h1 style="font-size: 1.5rem; margin-bottom: 3rem; color: var(--text-muted); font-weight: 400;">llm-cost_v1.5.0
        </h1>

        <div class="hero-content">
            <h1>Predict costs<br>before they happen.</h1>
            <p class="subtitle" style="font-size: 1.5rem; max-width: 600px; margin: 0 auto 3rem auto;">
                The standard for static cost analysis.<br>
                Enforce budgets. Prevent rate drift. 100% Offline.
            </p>

            <div class="code-block">
                <div class="code-header">
                    <span class="dot" style="background:none; border:none; padding:0; color:#666;">$</span>
                    <span class="lang">install</span>
                </div>
                <pre><code>curl -sSfL https://get.llm-cost.dev | sh</code></pre>
            </div>

            <div class="cta-group" style="justify-content: center; margin-top: 3rem;">
                <a href="/pricing/" class="btn primary">View Plans & Pricing →</a>
                <a href="https://github.com/Rul1an/llm-cost" class="btn secondary">GitHub</a>
            </div>
        </div>
    </main>
</body>

</html>
