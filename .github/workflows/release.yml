name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Zig
        uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1
        with:
          version: 0.14.0

      - name: Unit Tests
        run: zig build test

      - name: Golden Tests
        if: runner.os == 'Linux'
        run: zig build test-golden

      - name: Fuzzing Sanity Check
        if: runner.os == 'Linux'
        # Run full iterations (2000 per model) - fast enough for CI
        run: zig build fuzz

      - name: Parity Check
        if: runner.os == 'Linux'
        # Relies on committed testdata/evil_corpus_v2.jsonl
        run: zig build test-parity

      - name: BPE Microbenchmark (sanity)
        if: runner.os == 'Linux'
        # Run to ensure no crashes in bench code, though timing is flaky on CI
        # Optimization level is handled by build.zig
        run: zig build bench

      - name: Generate FinOps Audit (Release Proof)
        if: runner.os == 'Linux'
        run: |
          ./scripts/finops/run_finops_suite.sh p0
          FINOPS_MAX_DRIFT_BPS=10 FINOPS_FAIL_FAST=true python3 tools/finops/render_report.py

      - name: Upload FinOps Proof
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: finops-audit-proof
          path: |
            reports/audit.json
            reports/perf_metrics.txt

  build-matrix:
    needs: verify
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Required for keyless cosign signing
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            suffix: linux-x86_64
            binary: llm-cost
            do_sbom: true
            do_sign: true
          - os: ubuntu-latest
            target: x86_64-linux-musl
            suffix: linux-x86_64-musl
            binary: llm-cost
            do_sbom: true
            do_sign: true
          - os: ubuntu-latest
            target: aarch64-linux-gnu
            suffix: linux-arm64
            binary: llm-cost
            do_sbom: true
            do_sign: true
          - os: ubuntu-latest
            target: x86_64-windows-gnu
            suffix: windows-x86_64.exe
            binary: llm-cost.exe
            do_sbom: true
            do_sign: true
          - os: macos-latest
            target: aarch64-macos
            suffix: macos-arm64
            binary: llm-cost
            do_sbom: false
            do_sign: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1
        with:
          version: 0.14.0

      - name: Install Cosign
        if: matrix.do_sign == true
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set Environment
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build
        uses: ./.github/actions/zig-cross-compile
        with:
          version: "0.14.0"
          strict_version: true
          target: ${{ matrix.target }}
          project-type: zig
          cmd: "-Doptimize=ReleaseFast -Dversion=${{ env.APP_VERSION }}"
          use_cache: true
          sbom: false # Using anchore/sbom-action instead
          sign: false # Using manual cosign step
      - name: Create Dist Directory
        run: mkdir -p dist

      - name: Generate SBOM
        if: matrix.do_sbom == true
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.9
        with:
          path: zig-out/bin
          artifact-name: llm-cost-${{ matrix.suffix }}.cdx.json
          format: cyclonedx-json
          output-file: dist/llm-cost-${{ matrix.suffix }}.cdx.json
          upload-artifact: false


      - name: Sign Artifact
        if: matrix.do_sign == true
        run: |
          cosign sign-blob --yes \
            --output-certificate dist/llm-cost-${{ matrix.suffix }}.crt \
            --output-signature dist/llm-cost-${{ matrix.suffix }}.sig \
            zig-out/bin/${{ matrix.binary }}

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@897ed5eab6ed058a474202017ada7f40bfa52940 # v1.4.3
        with:
          subject-path: "zig-out/bin/${{ matrix.binary }}"

      - name: Stage Artifacts
        run: |
          # dist directory created earlier
          cp "zig-out/bin/${{ matrix.binary }}" "dist/llm-cost-${{ matrix.suffix }}"

      - name: Smoke Test
        if: matrix.target == 'x86_64-linux-gnu' || matrix.target == 'aarch64-macos'
        run: |
          ./dist/llm-cost-${{ matrix.suffix }} count --model gpt-4o <<< "Hello world"

      - name: Upload Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: llm-cost-${{ matrix.suffix }}-signed
          path: |
            dist/llm-cost-${{ matrix.suffix }}
            dist/llm-cost-${{ matrix.suffix }}.sig
            dist/llm-cost-${{ matrix.suffix }}.crt
            dist/llm-cost-${{ matrix.suffix }}.cdx.json

  release:
    needs: build-matrix
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts

      - name: Generate Checksums
        run: |
          # Flatten artifacts and generate checksums.txt
          mkdir -p release_assets

          shopt -s nullglob
          # Iterate over downloaded artifact dirs
          for dir in artifacts/*-signed; do
            # The dir name is "llm-cost-<suffix>-signed"
            # Inside is "llm-cost-<suffix>" binary + sigs
            # We want to move everything to release_assets
            cp -- "$dir"/* release_assets/
          done

          # Add FinOps Audit
          # Downloaded to artifacts/finops-audit-proof
          if [ -d "artifacts/finops-audit-proof" ]; then
             cp artifacts/finops-audit-proof/* release_assets/
          fi

          cd release_assets
          # Generate checksums for binaries (exclude .sig, .crt, .cdx.json)
          # Spec requires shasum format: "<hash>  <filename>"
          shasum -a 256 llm-cost-* | grep "^[a-f0-9]\{64\}  llm-cost-[^.]*$" > checksums.txt

          # Verify content
          cat checksums.txt
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10

    steps:
      - name: Verify Released Artifacts
        run: |
          # This assumes the release is publicly available immediately
          TAG=${GITHUB_REF#refs/tags/}
          echo "Verifying release $TAG..."

          # Install GitHub CLI (pre-installed on runner)

          # Verify the linux-x86_64 binary as a sample
          gh release download $TAG -p "llm-cost-linux-x86_64" --repo ${{ github.repository }}

          echo "Run gh attestation verify..."
          gh attestation verify llm-cost-linux-x86_64 --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      attestations: read
