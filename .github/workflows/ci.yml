name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Zig
        uses: mlugg/setup-zig@v1 # TODO: Pin SHA
        with:
          version: 0.14.0

      - name: Build
        run: zig build

      - name: Run Unit Tests
        run: zig build test

      - name: Run Golden Tests
        run: zig build test-golden

  finops_p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Zig
        uses: mlugg/setup-zig@v1 # TODO: Pin SHA
        with:
          version: 0.14.0

      - name: Run FinOps Suite (P0)
        run: ./scripts/finops/run_finops_suite.sh p0

      - name: Render FinOps summary + audit.json
        run: |
          FINOPS_MAX_DRIFT_BPS=10 \
          FINOPS_FOCUS_VERSION=1.1 \
          FINOPS_FAIL_FAST=true \
          python3 tools/finops/render_report.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finops-reports-p0
          path: reports/

  finops_p1:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Zig
        uses: mlugg/setup-zig@v1 # TODO: Pin SHA
        with:
          version: 0.14.0

      - name: Run FinOps Suite (P1)
        run: ./scripts/finops/run_finops_suite.sh p1

      - name: Render FinOps summary + audit.json
        run: |
          FINOPS_MAX_DRIFT_BPS=10 \
          FINOPS_FOCUS_VERSION=1.1 \
          FINOPS_FAIL_FAST=true \
          python3 tools/finops/render_report.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finops-reports-p1
          path: reports/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: mlugg/setup-zig@v1 # TODO: Pin SHA
        with:
          version: 0.14.0
      - run: zig fmt --check build.zig src/
