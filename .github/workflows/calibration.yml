name: Calibration Guardrails

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 8 * * 1' # Weekly (Monday 8am)

jobs:
  offline-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0 # Matching project version

      - name: Build and Test
        run: |
          zig build test
          zig build -Doptimize=ReleaseSafe

      - name: Verify Calibrate Command (Offline)
        run: |
          # 1. Create Dummy Data
          echo '{"estimated_total_usd": "5050.00"}' > estimates.json
          echo "ResourceId,BilledCost,EffectiveCost,UsageQuantity,UsageUnit,ChargeCategory,x-llm-model" > actuals.csv
          echo "r1,50.00,50.00,1,req,usage,model-A" >> actuals.csv
          # Generate 100 rows to satisfy min_samples=100 default
          for i in {1..100}; do
            echo "gen_$i,50.00,50.00,1,req,usage,model-A" >> actuals.csv
          done

          # 2. Run Command (Expect OK)
          ./zig-out/bin/llm-cost calibrate --estimates estimates.json --actuals actuals.csv --format table

          # 3. Verify Output status
          if [ $? -eq 0 ]; then
            echo "Calibration run successful."
          else
            echo "Calibration run failed!"
            exit 1
          fi

      - name: Verify Drift Failure Mode
        run: |
          # Create drifting data (Actual 200 vs Estimate 100)
          # Create drifting data (Actual 200 vs Estimate 100) - Huge Drift to guarantee warning
          echo "r3,1000.00,1000.00,1,req,usage,model-A" >> actuals.csv

          # Run with --fail-on-drift warn (Should exit 1 or 2)
          # Run with --fail-on-drift warn (Should exit 1 or 2)
          # Use set +e to capture exit code robustly
          set +e
          ./zig-out/bin/llm-cost calibrate --estimates estimates.json --actuals actuals.csv --fail-on-drift warn
          err=$?
          set -e

          if [ "$err" -eq 1 ] || [ "$err" -eq 2 ]; then
            echo "Correctly failed on drift (Exit Code $err)"
          else
            echo "Did not fail on drift as expected! Exit Code: $err"
            exit 1
          fi
