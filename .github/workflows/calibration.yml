name: Calibration Loop

on:
  push:
    branches:
      - 'release/**' # Monitor release branches (e.g., soft-launch)
  schedule:
    - cron: '0 8 * * 1' # Weekly (Monday 8AM)
  workflow_dispatch:

jobs:
  finops-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Run FinOps Suite (P1)
        run: |
          ./scripts/finops/run_finops_suite.sh p1
        env:
          # Fail if drift exceeds 100 bps (1%)
          FINOPS_MAX_DRIFT_BPS: 100
          FINOPS_FAIL_FAST: true

      - name: Upload Drift Reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: calibration-reports
          path: reports/*.toml
