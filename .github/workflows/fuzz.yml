name: Fuzz Safety

permissions:
  contents: read

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Zig
        uses: mlugg/setup-zig@0399d821362e4975db3e470129dc3398c3e46c75 # v1
        with:
          version: 0.14.0

      - name: Run Fuzz Harness
        # Runs the "fuzz" step defined in build.zig, which executes src/fuzz_test.zig
        run: zig build fuzz
