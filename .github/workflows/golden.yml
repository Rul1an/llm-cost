name: Golden Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generate-golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.11'

      - name: Install tiktoken
        run: pip install tiktoken==0.8.0

      - name: Generate golden data
        run: python scripts/generate_golden.py

      - name: Verify generated format
        run: head -n 5 test/golden/corpus_v2.jsonl

      - name: Upload golden corpus
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: golden-corpus
          path: test/golden/corpus_v2.jsonl

  test-parity:
    needs: generate-golden
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download golden corpus
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: golden-corpus
          path: test/golden/

      - name: Setup Zig
        uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1 (Replaces goto-bus-stop)
        with:
          version: 0.14.0

      - name: Download vocabularies
        run: chmod +x scripts/update_vocab.sh && ./scripts/update_vocab.sh

      - name: Run golden tests
        run: zig build test-golden

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: golden-failures
          path: test/golden/failures.log
